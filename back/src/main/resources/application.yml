spring:
  application:
    name: recadero-backend
  profiles:
    active: dev
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema; validate only
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  
  # DataSource Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/recadero
    username: recadero
    password: recadero123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    validate-on-migrate: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: redis123
    timeout: 2000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1
  
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour in ms
      cache-null-values: false
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      properties:
        linger:
          ms: 10
        batch:
          size: 16384
    consumer:
      bootstrap-servers: localhost:9092
      group-id: recadero-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      max-poll-records: 100
  
  # Cloud Stream Configuration (for Kafka)
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
          default-replication-factor: 1
      bindings:
        user-events-out-0:
          destination: user-events
        order-events-out-0:
          destination: order-events
        promotion-events-out-0:
          destination: promotion-events

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    min-response-size: 1024

# Logging Configuration
logging:
  level:
    root: INFO
    org.sirantar.recadero: DEBUG
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Modulith Configuration
modulith:
  events:
    publication-delay: 100  # ms
    republish-on-startup: true

---
# Development Profile Configuration
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    root: INFO
    org.sirantar.recadero: DEBUG
    org.springframework: DEBUG
    org.hibernate: DEBUG

---
# Test Profile Configuration
spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:recadero-test
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  flyway:
    enabled: false  # Let Hibernate manage schema in tests

logging:
  level:
    root: WARN
    org.sirantar.recadero: INFO

---
# Production Profile Configuration
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}

server:
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    org.sirantar.recadero: INFO
    org.springframework: WARN
