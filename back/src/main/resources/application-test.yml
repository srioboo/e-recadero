# Test Profile Configuration
# Used for integration and unit tests. The datasource is a real PostgreSQL
# instance provisioned by Testcontainers (see TestcontainersConfiguration),
# so tests run against the same database engine as production. The
# spring.datasource.* values below are placeholders overridden at runtime
# via @DynamicPropertySource.
# Activate with: spring.profiles.active=test or @ActiveProfiles("test")

spring:
  application:
    name: recadero-backend
  cloud:
    function:
      scan:
        enabled: false
    stream:
      kafka:
        binder:
          configuration:
            max.in.flight.requests.per.connection: 1
  autoconfigure:
    exclude:
      - org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        generate_statistics: false
  
  # PostgreSQL via Testcontainers; overridden by TestcontainersConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/recadero_test
    driver-class-name: org.postgresql.Driver
    username: recadero
    password: recadero123
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  # Flyway enabled for tests to create schemas properly
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  # Redis with Testcontainers (if available)
  redis:
    host: localhost
    port: 6379
    password: redis123
  
  # Kafka with Testcontainers (if available)
  kafka:
    bootstrap-servers: localhost:9092

app:
  security:
    jwt:
      issuer: http://localhost:8080
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      access-token-expiry: 900
      refresh-token-expiry: 604800

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: WARN
    org.sirantar.recadero: INFO
    org.springframework.test: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.data: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
